name: releases
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # build targets
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: '386'
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 [pinned by action-pin]
        with:
          fetch-depth: 0
      - name: Set up Golang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 [pinned by action-pin]
        with:
          go-version: 1.25
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 [pinned by action-pin]
        with:
          node-version: 22
      - name: Check if the version string was updated
        run: |
          VERSION=$(echo ${GITHUB_REF} | awk -F/ '{print substr($3,2,10);}')

          if ! grep "var version string = \"$VERSION\"" main.go; then
            echo "The version string inside main.go should be updated to $VERSION"
            exit 1
          fi
      - name: Build for ${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          # Build frontend assets first
          make -C server frontend
          go build -x -v -mod=vendor -o "tty-share_${GOOS}-${GOARCH}"
      - name: Release
        uses: elisescu/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2 [pinned by action-pin]
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: tty-share_*

